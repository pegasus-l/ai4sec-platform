server {
    listen 80;
    server_name _;

    # ASIS 前端 + API
    location / {
        proxy_pass http://asis:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ASIS API 直通
    location /api/ {
        proxy_pass http://asis:8003;
        proxy_set_header Host $host;
        proxy_set_header ADMIN_TOKEN $http_admin_token;
    }

    # ai4sec 洞察（反代到 ai4sec:8100）
    location /insights/ {
        proxy_pass http://ai4sec:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header sec-ai-hot-session $cookie_sec_ai_hot_session;
    }

    # 复现服务（反代到 repro:4096）
    location /repro/ {
        proxy_pass http://repro:4096/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket 支持（opencode serve 可能用到）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
