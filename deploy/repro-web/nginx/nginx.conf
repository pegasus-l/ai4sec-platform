# repro 容器内 Web 服务总机: 常驻 8080, 按 /task/{id}/ 分发到各任务独立端口
# 配置文件由 register.py 从 tasks.json 生成, 热 reload 无需重启容器
worker_processes auto;
pid /workspace/.repro-web/nginx/nginx.pid;
error_log /workspace/.repro-web/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log /workspace/.repro-web/nginx/access.log;

    # WebSocket 升级支持 (ai4sec 的 WS 反代会把 /repro-web/* 转发到这)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 100m;

        # ai4sec/运维探活
        location = /_nginx_health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # 未注册任务路径 → 明确 404
        location / {
            default_type text/plain;
            return 404 "no repro task registered for this path\n";
        }

        # 各任务的 location 由 register.py 生成
        include /workspace/.repro-web/nginx/tasks.conf;
    }
}
