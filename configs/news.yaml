sources:
  arxiv:
    enabled: true
    max_results: 30
    queries:
      - 'all:"AI security"'
      - 'all:"LLM security"'
      - 'all:"agent security"'
  github:
    enabled: true
    max_results: 30
    readme_limit: 10
    queries:
      - '"AI security" in:name,description,readme'
      - '"LLM security" in:name,description,readme'
      - '"agent security" in:name,description,readme'
  rss:
    enabled: true
    urls:
      - https://feeds.feedburner.com/TheHackersNews
  x:
    enabled: false
    api_base: https://api.getxapi.com
    tweets_per_account: 20
    accounts: []
  asis:
    enabled: false
    base_url: ""
    fetch_limit: 500
  awesome:
    enabled: true
    repositories:
      - tmgthb/Autonomous-Agents
selection:
  highlight_score: 70
  highlight_limit: 12
