sources:
  arxiv:
    enabled: true
    max_results: 30
    queries:
      - 'all:"AI security"'
      - 'all:"LLM security"'
      - 'all:"agent security"'
  github:
    enabled: true
    max_results: 30
    queries:
      - '"AI security" in:name,description,readme'
      - '"LLM security" in:name,description,readme'
      - '"agent security" in:name,description,readme'
  rss:
    enabled: true
    urls:
      - https://feeds.feedburner.com/TheHackersNews
selection:
  highlight_score: 70
  highlight_limit: 12
